name: CoolWipsEconomy
version: '1.1.17'
main: io.github.coollikecoolwip.economy.CoolWipsEconomy
description: Sell and buy Minecraft items for UnbelievaBoat cash using DiscordSRV.
author: coollikecoolwip
api-version: '26.2'
depend:
  - DiscordSRV
commands:
  sell:
    description: Sell an item for UnbelievaBoat cash.
    usage: /sell <item> [amount]
    permission: coolwipseconomy.sell
  sellall:
    description: Sell all of one item.
    usage: /sellall <item>
    permission: coolwipseconomy.sell
  buy:
    description: Buy an item using UnbelievaBoat cash.
    usage: /buy <item> [amount]
    permission: coolwipseconomy.buy
  shop:
    description: View items available for purchase.
    usage: /shop [page]
    permission: coolwipseconomy.use
  pay:
    description: Send server cash to another player or start an item trade.
    usage: /pay <player> <amount> or /pay <player> <item> [amount]
    permission: coolwipseconomy.use
  sellto:
    description: Sell an item directly to another player.
    usage: /sellto <player> <item> [amount]
    permission: coolwipseconomy.use
  buyfrom:
    description: Buy an item directly from another player.
    usage: /buyfrom <player> <item> [amount]
    permission: coolwipseconomy.use
  sellchest:
    description: Automatically sell priced items placed in a sell chest when it is closed.
    usage: /sellchest <create|remove|status>
    permission: coolwipseconomy.use
  prices:
    description: View item sell prices.
    usage: /prices [page]
    permission: coolwipseconomy.use
  history:
    description: View your recent economy transactions.
    usage: /history
    permission: coolwipseconomy.use
  balance:
    description: View your UnbelievaBoat cash balance.
    usage: /balance
    aliases: [bal]
    permission: coolwipseconomy.use
  cweconomy:
    description: CoolWips Economy administration.
    usage: /cweconomy <reload|status|maintenance>
    permission: coolwipseconomy.admin
permissions:
  coolwipseconomy.use:
    default: true
  coolwipseconomy.sell:
    default: true
  coolwipseconomy.buy:
    default: true
  coolwipseconomy.admin:
    default: op
