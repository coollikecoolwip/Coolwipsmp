  minimum-bounty: 100
  maximum-bounty: 1000000
  sell-tax: 0.05
  buy-tax: 0.05
  # Renewable items keep full value for normal volumes. Heavy daily volume lowers
  # that specific item's sell price until it reaches the configured floor.
  market-full-price-units: 2048
  market-step-units: 512
  market-price-drop: 0.90
  market-min-price: 0.0001
  market-moss-min-price: 0.017
  market-rules-version: 6
  # Economy monitoring only; these thresholds log a flag but never block a player.
  ledger-max-entries: 20000
  anomaly:
    player-money-created-limit: 2500000
    player-money-transferred-limit: 5000000
    player-items-sold-limit: 250000
    single-sale-limit: 500000
  # Market prices use the day's highest observed sold volume, so rollbacks cannot raise prices.
  # Per-player balancing is defined in market.txt and documented for every priced item in market_schedule.txt.
  # Each player's market volume is independent; one grinder cannot depress another player's prices.

