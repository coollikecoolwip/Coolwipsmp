name: Build CoolWips Command Bridge

on:
  pull_request:
    paths:
      - 'CoolWipsCommandBridge/**'
      - '.github/workflows/build-command-bridge.yml'
  push:
    paths:
      - 'CoolWipsCommandBridge/**'
      - '.github/workflows/build-command-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coolwips-command-bridge-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'Build CoolWipsCommandBridge ')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CoolWipsCommandBridge
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: CoolWipsCommandBridge/pom.xml

      - name: Build plugin
        run: mvn -B -ntp clean package

      - name: Verify JAR
        run: test -f build-output/CoolWipsCommandBridge.jar

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoolWipsCommandBridge
          path: CoolWipsCommandBridge/build-output/CoolWipsCommandBridge.jar
          if-no-files-found: error

      - name: Commit built JAR to repository
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: .
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD:CoolWipsCommandBridge)" != "$(git rev-parse origin/main:CoolWipsCommandBridge)" ]; then
            echo "Main changed during the build; the newer run will publish its JAR."
            exit 0
          fi
          git merge --ff-only origin/main
          cp CoolWipsCommandBridge/build-output/CoolWipsCommandBridge.jar CoolWipsCommandBridge/CoolWipsCommandBridge.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CoolWipsCommandBridge/CoolWipsCommandBridge.jar
          if git diff --cached --quiet; then
            echo "JAR is already up to date."
            exit 0
          fi
          git commit -m "Build CoolWipsCommandBridge 1.2.4"
          git push
