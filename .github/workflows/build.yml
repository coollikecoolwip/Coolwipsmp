name: Build CoolWips Economy

on:
  push:
    paths-ignore:
      - 'CoolWipsEconomy-*.jar'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Build
        run: mvn -U clean package

      - name: Find built JAR
        id: jar
        run: echo "path=$(find target -maxdepth 1 -type f -name 'CoolWipsEconomy-*.jar' | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoolWipsEconomy
          path: ${{ steps.jar.outputs.path }}

      - name: Put plugin JAR in repository
        run: |
          JAR="$(find target -maxdepth 1 -type f -name 'CoolWipsEconomy-*.jar' | head -n 1)"
          cp "$JAR" "./$(basename "$JAR")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'CoolWipsEconomy-*.jar'
          if git diff --cached --quiet; then
            echo "JAR is already up to date."
          else
            git commit -m "Update built CoolWips Economy JAR"
            git push
          fi
