name: Build CoolWips Economy

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Build
        run: mvn -U clean package
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: CoolWipsEconomy
          path: target/CoolWipsEconomy-1.0.0.jar
