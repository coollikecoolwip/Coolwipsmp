name: Build CoolWips Economy
# Build/publish current plugin version

on:
  pull_request:
    paths:
      - 'CoolWipsEconomy/**'
      - '!CoolWipsEconomy/*.jar'
      - '.github/workflows/build.yml'
  push:
    paths:
      - 'CoolWipsEconomy/**'
      - '!CoolWipsEconomy/*.jar'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coolwips-economy-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Update built CoolWips Economy JAR'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CoolWipsEconomy
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: CoolWipsEconomy/pom.xml

      - name: Build
        run: mvn -U --batch-mode clean package

      - name: Verify built JAR
        id: jar
        shell: bash
        run: |
          JAR="$(find target -maxdepth 1 -type f -name 'CoolWipsEconomy-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)"
          if [ -z "$JAR" ]; then
            echo "No CoolWipsEconomy JAR was produced."
            exit 1
          fi
          echo "Built $JAR"
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoolWipsEconomy
          path: CoolWipsEconomy/${{ steps.jar.outputs.path }}
          if-no-files-found: error

      - name: Put plugin JAR in repository
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: .
        shell: bash
        run: |
          JAR="$(find CoolWipsEconomy/target -maxdepth 1 -type f -name 'CoolWipsEconomy-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)"
          if [ -z "$JAR" ]; then
            echo "No built JAR found."
            exit 1
          fi

          # Never publish an older build over newer source changes.
          git fetch origin main
          if [ "$(git rev-parse HEAD:CoolWipsEconomy)" != "$(git rev-parse origin/main:CoolWipsEconomy)" ]; then
            echo "Main changed during the build; the newer run will publish its JAR."
            exit 0
          fi
          git merge --ff-only origin/main
          cp "$JAR" "CoolWipsEconomy/$(basename "$JAR")"

          # Ensure only the current versioned JAR is present.
          find CoolWipsEconomy -maxdepth 1 -type f -name 'CoolWipsEconomy-*.jar' ! -name "$(basename "$JAR")" -delete

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage deletions as well as the new artifact, leaving only the current versioned JAR.
          git add -A CoolWipsEconomy/
          if git diff --cached --quiet; then
            echo "JAR is already up to date."
          else
            git commit -m "Update built CoolWips Economy JAR"
            git push origin HEAD:main
          fi
