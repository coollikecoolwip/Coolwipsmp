name: Build CoolWips Economy

on:
  push:
    paths:
      - 'CoolWipsEconomy/**'
      - '!CoolWipsEconomy/*.jar'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coolwips-economy-build
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Update built CoolWips Economy JAR'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CoolWipsEconomy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Build
        run: mvn -U clean package

      - name: Find built JAR
        id: jar
        run: echo "path=$(find target -maxdepth 1 -type f -name 'CoolWipsEconomy-*.jar' | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoolWipsEconomy
          path: CoolWipsEconomy/${{ steps.jar.outputs.path }}

      - name: Put plugin JAR in repository
        working-directory: .
        run: |
          JAR="$(find CoolWipsEconomy/target -maxdepth 1 -type f -name 'CoolWipsEconomy-*.jar' | head -n 1)"
          git rm -f --ignore-unmatch CoolWipsEconomy/CoolWipsEconomy-*.jar
          cp "$JAR" "CoolWipsEconomy/$(basename "$JAR")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'CoolWipsEconomy/CoolWipsEconomy-*.jar'
          if git diff --cached --quiet; then
            echo "JAR is already up to date."
          else
            git commit -m "Update built CoolWips Economy JAR"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
