name: Build CoolWips Economy

on:
  push:
    paths-ignore:
      - 'CoolWipsEconomy-1.0.0.jar'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Build
        run: mvn -U clean package

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoolWipsEconomy
          path: target/CoolWipsEconomy-1.0.0.jar

      - name: Put plugin JAR in repository
        run: |
          cp target/CoolWipsEconomy-1.0.0.jar ./CoolWipsEconomy-1.0.0.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CoolWipsEconomy-1.0.0.jar
          if git diff --cached --quiet; then
            echo "JAR is already up to date."
          else
            git commit -m "Update built CoolWips Economy JAR"
            git push
          fi
