name: Build CoolWips Progression

on:
  push:
    paths:
      - 'ProgressionControl/**'
      - '.github/workflows/build-progression.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ProgressionControl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: CoolWipsProgression-1.0.0
          path: ProgressionControl/target/CoolWipsProgression-1.0.0.jar
