name: Build CoolWips Progression

on:
  push:
    paths:
      - 'ProgressionControl/**'
      - '.github/workflows/build-progression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: progression-build
  cancel-in-progress: true

jobs:
  build:
    name: Compile CoolWipsProgression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ProgressionControl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build plugin
        run: mvn -B -ntp clean package

      - name: Verify JAR exists
        run: test -f target/CoolWipsProgression-1.1.0.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: CoolWipsProgression-1.1.0
          path: ProgressionControl/target/CoolWipsProgression-1.1.0.jar
          if-no-files-found: error
          retention-days: 14
