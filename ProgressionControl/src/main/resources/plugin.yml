name: CoolWipsProgression
version: 1.1.5
main: io.github.coollikecoolwip.progression.CoolWipsProgression
api-version: '1.21'
description: Manual server-wide progression gates for CoolWips SMP.
author: coollikecoolwip

commands:
  progression:
    description: View and manage CoolWips progression gates.
    usage: /progression <status|unlock|lock|reload> [gate]
    aliases: [prog]

permissions:
  coolwipsprogression.admin:
    description: View, lock, unlock, and reload progression gates.
    default: op
  coolwipsprogression.bypass:
    description: Bypass every CoolWips progression gate.
    default: false
