# CoolWips Progression Control 1.1.1
# Every gate is LOCKED by default.
# Use /progression unlock <gate> to open a stage for normal players.
# Unlock state is saved here and survives restarts.
#
# Suggested progression order:
# iron -> copper -> gold -> redstone -> lapis -> emerald -> diamonds
# -> nether -> netherite -> enchanting -> brewing -> end
# -> elytra -> shulker -> totems -> tridents

gates:
  iron: false
  copper: false
  gold: false
  redstone: false
  lapis: false
  emerald: false
  diamonds: false

  nether: false
  netherite: false
  enchanting: false
  brewing: false
  end: false

  elytra: false
  shulker: false
  totems: false
  tridents: false

messages:
  locked: "&cProgression locked: &f{gate}&c. An admin has not unlocked it yet."
  dimension-locked: "&cThe {gate} is not unlocked yet."
  item-locked: "&c{gate} progression is not unlocked yet."
